; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Architecture A -- synchronous serial primitives only (the default).
; No WiFi, no MQTT, no broker dependency. Build/upload with:
;   pio run -e esp32doit-devkit-v1 -t upload
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6

; Architecture B -- everything above PLUS continuous ADC telemetry over MQTT.
; A superset: all serial primitives still work, so the synchronous
; architecture remains usable on this build even with the broker down.
; Requires include/telemetry_config.h (copy from telemetry_config.example.h).
;   pio run -e esp32doit-devkit-v1-mqtt -t upload
[env:esp32doit-devkit-v1-mqtt]
extends = env:esp32doit-devkit-v1
build_flags = -DENABLE_MQTT_TELEMETRY
lib_deps = knolleary/PubSubClient@^2.8
