# Project-local Mosquitto config for Architecture B (asynchronous MQTT telemetry).
#
# Run with:  mosquitto -c mosquitto.conf -v
#
# The Windows service installed by the Mosquitto package binds to localhost
# only, which the ESP32 cannot reach over WiFi. This config binds all
# interfaces so the MCU can publish to the broker across the LAN.
#
# Port 1884, not the default 1883: the installed "Mosquitto Broker" Windows
# service already holds 1883 and stopping it requires admin. Using 1884 keeps
# this project's broker self-contained and leaves that service untouched.

listener 1884 0.0.0.0

# POC-only: no credentials. The broker is expected to run on a trusted local
# network (personal hotspot / home WPA2), never exposed to the internet.
allow_anonymous true

# Keep the broker stateless between runs -- the durable record of telemetry is
# the backend's adc_stream.txt, not the broker.
persistence false

connection_messages true
log_type error
log_type warning
log_type notice
log_type information
